<main><section class="intro"><div class="eyebrow">&#1054;&#1089;&#1086;&#1073;&#1077;&#1085;&#1085;&#1099;&#1077; &#1087;&#1088;&#1077;&#1076;&#1083;&#1086;&#1078;&#1077;&#1085;&#1080;&#1103;</div><h1>&#1040;&#1082;&#1094;&#1080;&#1080; &#1089;&#1072;&#1083;&#1086;&#1085;&#1072;</h1><p>&#1042;&#1099;&#1073;&#1077;&#1088;&#1080;&#1090;&#1077; &#1087;&#1086;&#1076;&#1093;&#1086;&#1076;&#1103;&#1097;&#1077;&#1077; &#1087;&#1088;&#1077;&#1076;&#1083;&#1086;&#1078;&#1077;&#1085;&#1080;&#1077; &#1080; &#1087;&#1086;&#1076;&#1072;&#1088;&#1080;&#1090;&#1077; &#1089;&#1077;&#1073;&#1077; &#1085;&#1077;&#1084;&#1085;&#1086;&#1075;&#1086; &#1073;&#1086;&#1083;&#1100;&#1096;&#1077; &#1079;&#1072;&#1073;&#1086;&#1090;&#1099;. &#1047;&#1076;&#1077;&#1089;&#1100; &#1089;&#1086;&#1073;&#1088;&#1072;&#1085;&#1099; &#1072;&#1082;&#1090;&#1091;&#1072;&#1083;&#1100;&#1085;&#1099;&#1077; &#1072;&#1082;&#1094;&#1080;&#1080; &#1089;&#1072;&#1083;&#1086;&#1085;&#1072;.</p></section><section class="promo-grid" id="promoGrid" aria-live="polite"><div class="empty">&#1047;&#1072;&#1075;&#1088;&#1091;&#1078;&#1072;&#1077;&#1084; &#1072;&#1082;&#1090;&#1091;&#1072;&#1083;&#1100;&#1085;&#1099;&#1077; &#1087;&#1088;&#1077;&#1076;&#1083;&#1086;&#1078;&#1077;&#1085;&#1080;&#1103;&#8230;</div></section></main><footer class="site-footer">&#1051;&#1077;&#1087;&#1077;&#1089;&#1090;&#1086;&#1082; ? &#1050;&#1088;&#1072;&#1089;&#1086;&#1090;&#1072; &#1085;&#1072;&#1095;&#1080;&#1085;&#1072;&#1077;&#1090;&#1089;&#1103; &#1089; &#1079;&#1072;&#1073;&#1086;&#1090;&#1099;</footer>
<script>
const grid=document.getElementById('promoGrid');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=v=>{if(!v)return '';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?v:d.toLocaleDateString('ru-RU')};
async function load(){try{const r=await fetch('/api/promotions',{cache:'no-store'});if(!r.ok)throw Error('?? ??&#1040;&#1082;&#1094;&#1080;&#1080; &#1089;&#1072;&#1083;&#1086;&#1085;&#1072;??? ?');const data=await r.json();const items=data.promotions||[];if(!items.length){grid.innerHTML='<div class="empty">&#1057;&#1077;&#1081;&#1095;&#1072;&#1089; &#1072;&#1082;&#1090;&#1080;&#1074;&#1085;&#1099;&#1093; &#1072;&#1082;&#1094;&#1080;&#1081; &#1085;&#1077;&#1090;. &#1047;&#1072;&#1075;&#1083;&#1103;&#1085;&#1080;&#1090;&#1077; &#1087;&#1086;&#1079;&#1078;&#1077; &#8212; &#1085;&#1086;&#1074;&#1099;&#1077; &#1087;&#1088;&#1077;&#1076;&#1083;&#1086;&#1078;&#1077;&#1085;&#1080;&#1103; &#1086;&#1073;&#1103;&#1079;&#1072;&#1090;&#1077;&#1083;&#1100;&#1085;&#1086; &#1087;&#1086;&#1103;&#1074;&#1103;&#1090;&#1089;&#1103;!</div>';return;}grid.innerHTML=items.map(x=>`<article class="promo-card">${x.image_url?`<div class="promo-image-wrap"><img src="${esc(x.image_url)}" alt="${esc(x.title)}" loading="lazy" onerror="this.closest('.promo-image-wrap').remove()"></div>`:''}<div class="promo-body"><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p><div class="price">${x.old_price?`<span class="old">${esc(x.old_price)}</span>`:''}${esc(x.new_price||'')}</div>${x.start_date||x.end_date?`<div class="dates">?: ${esc(fmtDate(x.start_date)||'???  ??')} ? ${esc(fmtDate(x.end_date)||'???  ?')}</div>`:''}</div></article>`).join('');}catch(e){grid.innerHTML='<div class="error">&#1053;&#1077; &#1091;&#1076;&#1072;&#1083;&#1086;&#1089;&#1100; &#1079;&#1072;&#1075;&#1088;&#1091;&#1079;&#1080;&#1090;&#1100; &#1072;&#1082;&#1094;&#1080;&#1080;. &#1055;&#1086;&#1078;&#1072;&#1083;&#1091;&#1081;&#1089;&#1090;&#1072;, &#1086;&#1073;&#1085;&#1086;&#1074;&#1080;&#1090;&#1077; &#1089;&#1090;&#1088;&#1072;&#1085;&#1080;&#1094;&#1091; &#1087;&#1086;&#1079;&#1078;&#1077;.</div>';console.error(e)}}load();
