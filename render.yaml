services:
  - type: web
    name: lepetok-salon
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m py_compile server.py"
    startCommand: "python server.py"
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "10000"
